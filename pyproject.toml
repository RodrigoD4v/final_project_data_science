[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "eor_project"
version = "0.0.1"
description = "Projeto de an\u00e1lise de dados desenvolvido por estudantes de p\u00f3s-gradua\u00e7\u00e3o em Ci\u00eancias de Dados e Analytics, com foco na an\u00e1lise de dados de ofertas de emprego e candidatos."
authors = [
  { name = "Grupo EOR - Especializa\u00e7\u00e3o em Ci\u00eancias de Dados e Analytics" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["eor_project"]
include = ["pyproject.toml", "eor_project/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["eor_project"]
force-sort-within-sections = true

